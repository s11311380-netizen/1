<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DINO RUN - 角色選擇版</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        /* ── Game container ─────────────────────────────────────── */
        #game {
            position: relative;
            overflow: hidden;
            background: #87CEEB;
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* ── Top-right audio buttons ─────────────────────────────── */
        #btnBar {
            position: absolute;
            top: 10px; right: 10px;
            z-index: 100;
            display: flex; gap: 6px;
        }
        #btnBar button {
            cursor: pointer;
            padding: 4px 10px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            font-size: 12px;
            font-family: 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
            transition: background 0.2s;
            white-space: nowrap;
        }
        #btnBar button:hover { background: rgba(0,0,0,0.7); }
        #btnBar button.muted { background: rgba(180,0,0,0.55); }

        /* ── Loading screen ──────────────────────────────────────── */
        #loadingScreen {
            position: absolute; inset: 0;
            background: #1a1a2e;
            color: #fff;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 200; gap: 14px;
            font-size: 22px;
            font-family: 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
        }
        .loading-bar-wrap {
            width: 200px; height: 8px;
            background: rgba(255,255,255,0.15);
            border-radius: 4px; overflow: hidden;
        }
        .loading-bar-fill {
            height: 100%; width: 60%;
            background: #4fc3f7; border-radius: 4px;
            animation: loadPulse 1.2s ease-in-out infinite alternate;
        }
        @keyframes loadPulse { from { width: 30%; } to { width: 90%; } }

        /* ── Character Select Screen ─────────────────────────────── */
        #charSelectScreen {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.82);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 150;
            gap: 6px;
            padding: 8px 12px;
            color: #fff;
            font-family: 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
            box-sizing: border-box;
        }
        #charSelectScreen h2 {
            font-size: 18px;
            color: #4fc3f7;
            text-shadow: 0 0 10px rgba(79,195,247,0.7);
            margin: 0;
            line-height: 1.2;
        }
        #charSelectScreen .hint {
            font-size: 11px;
            color: #90a4ae;
            margin: 0 0 2px 0;
        }
        #charCardsContainer {
            display: flex; gap: 8px;
            align-items: stretch;
            justify-content: center;
            max-width: 880px;
            flex-wrap: nowrap;
        }
        .char-card {
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.18);
            border-radius: 8px;
            padding: 5px 6px;
            cursor: pointer;
            text-align: center;
            width: 95px;
            transition: border-color 0.2s, background 0.2s, transform 0.15s;
            box-sizing: border-box;
        }
        .char-card:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }
        .char-card.selected {
            border-color: #4fc3f7;
            background: rgba(79,195,247,0.22);
            box-shadow: 0 0 12px rgba(79,195,247,0.45);
            transform: translateY(-3px);
        }
        .char-name {
            font-size: 12px; font-weight: bold;
            color: #e0f7fa; margin-top: 3px;
            white-space: nowrap;
        }
        .char-desc {
            font-size: 10px; color: #90caf9; margin-top: 2px;
            line-height: 1.2;
        }
        /* Compact confirm button: small and neat, leaves plenty of space for card descriptions */
        #confirmCharBtn {
            background: linear-gradient(135deg, #4fc3f7, #0288d1);
            color: #fff; border: none;
            padding: 4px 18px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            margin-top: 4px;
            font-family: 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        #confirmCharBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 10px rgba(79,195,247,0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-dino">🦕</div>
                <div>
                    <h1>DINO RUN</h1>
                    <p>跑得越遠越好！</p>
                </div>
            </div>
            <div class="score-board">
                分 <span id="score" class="score">00000</span>
                <br>
                最高 <span id="highScore" class="score">00000</span>
            </div>
        </header>

        <main id="game" style="width: 900px; height: 300px;">

            <!-- Loading -->
            <div id="loadingScreen">
                <span>載入資源中…</span>
                <div class="loading-bar-wrap"><div class="loading-bar-fill"></div></div>
            </div>

            <!-- Character Select -->
            <section id="charSelectScreen">
                <h2>🦕 選擇你的角色</h2>
                <p class="hint">← → 鍵切換 ／ Enter 確認</p>
                <div id="charCardsContainer"></div>
                <button id="confirmCharBtn">✅ 確認出發！</button>
            </section>

            <!-- Top-right audio controls -->
            <div id="btnBar">
                <button id="musicBtn">🎵 音樂: 開</button>
                <button id="sfxBtn">🔊 音效: 開</button>
            </div>

            <!-- Canvas -->
            <canvas id="gameCanvas" width="900" height="300"></canvas>

            <!-- Start screen -->
            <section id="startScreen" style="display:none;">
                <div class="start-content">
                    <h2>🦕 DINO RUN</h2>
                    <p>準備好開始了嗎？</p>
                    <div class="start-key">⬆ SPACE 開始遊戲</div>
                </div>
            </section>

            <!-- Game Over -->
            <section id="gameOver" style="display:none;">
                <h2>GAME OVER</h2>
                <p>分數：<span id="finalScore">00000</span></p>
                <button id="restartBtn">🔄 重新選擇角色</button>
                <p style="margin-top:12px; font-size:14px;">⬆ SPACE 也可以返回選角</p>
            </section>

        </main>

        <footer class="controls">
            <div><span class="key">⬆</span><span class="key">SPACE</span> 跳躍</div>
            <div><span class="key">⬇</span> 趴下</div>
            <div>速度：<span id="speedText">1.0x</span></div>
            <button class="mode-btn" id="nightModeBtn">☀ / 🌙 夜間模式</button>
        </footer>
    </div>

    <script type="module" src="./js/main.js?v=9"></script>
</body>
</html>
