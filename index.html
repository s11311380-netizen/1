<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DINO RUN - Canvas Upgrade</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        /* Add minimal canvas styling while keeping original layout */
        #game { position: relative; overflow: hidden; background: #f7f7f7; }
        canvas { display: block; width: 100%; height: 100%; }
        #muteBtn { position: absolute; top: 10px; right: 10px; z-index: 100; cursor: pointer; padding: 5px 10px; background: rgba(0,0,0,0.5); color: white; border-radius: 5px; border: none; }
        .producer-tag { position: absolute; bottom: 10px; left: 10px; font-size: 14px; font-weight: bold; color: #333; z-index: 100; background: rgba(255,255,255,0.7); padding: 3px 8px; border-radius: 4px; }
        #loadingScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #333; color: #fff; display: flex; align-items: center; justify-content: center; z-index: 200; font-size: 24px; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-dino">🦖</div>
                <div>
                    <h1>DINO RUN</h1>
                    <p>躲避障礙，跑得更遠！</p>
                </div>
            </div>
            <div class="score-board">
                分數 <span id="score" class="score">00000</span>
                <br>
                最高 <span id="highScore" class="score">00000</span>
            </div>
        </header>

        <main id="game" style="width: 900px; height: 300px;">
            <div id="loadingScreen">載入資源中...</div>
            <button id="muteBtn">🔊 音效: 開</button>
            <div class="producer-tag">製作人：11311380/張智媛</div>
            <canvas id="gameCanvas" width="900" height="300"></canvas>
            
            <section id="startScreen" style="display:none;">
                <div class="start-content">
                    <h2>🦖 DINO RUN</h2>
                    <p>準備好開始了嗎？</p>
                    <div class="start-key">按 SPACE 開始遊戲</div>
                </div>
            </section>

            <section id="gameOver" style="display:none;">
                <h2>GAME OVER</h2>
                <p>分數：<span id="finalScore">00000</span></p>
                <button id="restartBtn">🔄 重新開始</button>
                <p style="margin-top: 15px; font-size: 16px;">按 SPACE 也可以重新開始</p>
            </section>
        </main>

        <footer class="controls">
            <div>
                <span class="key">↑</span>
                <span class="key">SPACE</span>
                跳躍
            </div>
            <div>
                <span class="key">↓</span>
                蹲下
            </div>
            <div>
                速度：<span id="speedText">1.0x</span>
            </div>
            <button class="mode-btn" id="nightModeBtn">
                日 / 夜 夜間模式
            </button>
        </footer>
    </div>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
