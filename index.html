<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DINO RUN - 角色選擇版</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        /* ── Game container ─────────────────────────────────────── */
        #game {
            position: relative;
            overflow: hidden;
            background: #87CEEB;
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* ── Top-right audio buttons ─────────────────────────────── */
        #btnBar {
            position: absolute;
            top: 10px; right: 10px;
            z-index: 100;
            display: flex; gap: 6px;
        }
        #btnBar button {
            cursor: pointer;
            padding: 4px 10px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            font-size: 12px;
            font-family: 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
            transition: background 0.2s;
            white-space: nowrap;
        }
        #btnBar button:hover { background: rgba(0,0,0,0.7); }
        #btnBar button.muted { background: rgba(180,0,0,0.55); }

        /* ── Loading screen ──────────────────────────────────────── */
        #loadingScreen {
            position: absolute; inset: 0;
            background: #1a1a2e;
            color: #fff;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 200; gap: 14px;
            font-size: 22px;
            font-family: 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
        }
        .loading-bar-wrap {
            width: 200px; height: 8px;
            background: rgba(255,255,255,0.15);
            border-radius: 4px; overflow: hidden;
        }
        .loading-bar-fill {
            height: 100%; width: 60%;
            background: #4fc3f7; border-radius: 4px;
            animation: loadPulse 1.2s ease-in-out infinite alternate;
        }
        @keyframes loadPulse { from { width: 30%; } to { width: 90%; } }

        /* ── Character Select Screen ─────────────────────────────── */
        #charSelectScreen {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            z-index: 150;
            padding: 8px 16px 10px;
            color: #fff;
            font-family: 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
            box-sizing: border-box;
        }
        .char-select-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }
        #charSelectScreen h2 {
            font-size: 16px;
            color: #4fc3f7;
            text-shadow: 0 0 10px rgba(79,195,247,0.7);
            margin: 0;
            line-height: 1.2;
        }
        #charSelectScreen .hint {
            font-size: 11px;
            color: #90a4ae;
            margin: 0;
        }
        #charCardsContainer {
            display: flex;
            gap: 10px;
            align-items: stretch;
            justify-content: center;
            max-width: 860px;
            flex-wrap: nowrap;
            margin-bottom: 4px;
        }
        .char-card {
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.18);
            border-radius: 8px;
            padding: 4px 6px 6px;
            cursor: pointer;
            text-align: center;
            width: 105px;
            transition: border-color 0.2s, background 0.2s, transform 0.15s;
            box-sizing: border-box;
        }
        .char-card:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }
        .char-card.selected {
            border-color: #4fc3f7;
            background: rgba(79,195,247,0.22);
            box-shadow: 0 0 12px rgba(79,195,247,0.45);
            transform: translateY(-2px);
        }
        .char-name {
            font-size: 12px;
            font-weight: bold;
            color: #e0f7fa;
            margin-top: 2px;
            white-space: nowrap;
        }
        .char-desc {
            font-size: 10px;
            color: #90caf9;
            margin-top: 2px;
            line-height: 1.2;
        }

        /* ── Rules Banner (Fruit & Meteor) ────────────────────────── */
        #rulesBanner {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 820px;
            justify-content: center;
            box-sizing: border-box;
            margin-top: 10px;
            margin-bottom: 2px;
        }
        .rule-item {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 10px;
            border-radius: 7px;
            font-size: 11px;
            line-height: 1.3;
            box-sizing: border-box;
        }
        .rule-icon {
            font-size: 18px;
            line-height: 1;
            flex-shrink: 0;
        }
        .rule-item.rule-fruit {
            background: rgba(231, 76, 60, 0.16);
            border: 1px solid rgba(231, 76, 60, 0.45);
            color: #ffcdd2;
        }
        .rule-item.rule-fruit .rule-title {
            color: #ff8a80;
            font-weight: bold;
        }
        .rule-item.rule-meteor {
            background: rgba(255, 152, 0, 0.16);
            border: 1px solid rgba(255, 152, 0, 0.45);
            color: #ffe0b2;
        }
        .rule-item.rule-meteor .rule-title {
            color: #ffb74d;
            font-weight: bold;
        }
        .rule-hl {
            color: #fff;
            font-weight: bold;
            text-decoration: underline;
        }

        /* ── Confirm Button (cleanly positioned, never overlaps cards) ── */
        #confirmCharBtn {
            background: linear-gradient(135deg, #4fc3f7, #0288d1);
            color: #fff;
            border: none;
            padding: 5px 26px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            font-family: 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
            box-shadow: 0 2px 10px rgba(79,195,247,0.35);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        #confirmCharBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 14px rgba(79,195,247,0.55);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-dino">🦕</div>
                <div>
                    <h1>DINO RUN</h1>
                    <p>跑得越遠越好！</p>
                </div>
            </div>
            <div class="score-board">
                分 <span id="score" class="score">00000</span>
                <br>
                最高 <span id="highScore" class="score">00000</span>
            </div>
        </header>

        <main id="game" style="width: 900px; height: 300px;">

            <!-- Loading -->
            <div id="loadingScreen">
                <span>載入資源中…</span>
                <div class="loading-bar-wrap"><div class="loading-bar-fill"></div></div>
            </div>

            <!-- Character Select -->
            <section id="charSelectScreen">
                <div class="char-select-header">
                    <h2>🦕 選擇你的角色</h2>
                    <span class="hint">（← → 鍵切換 ／ Enter 或點擊按鈕確認）</span>
                </div>

                <div id="charCardsContainer"></div>

                <div id="rulesBanner">
                    <div class="rule-item rule-fruit">
                        <span class="rule-icon">🍎</span>
                        <div class="rule-text">
                            <span class="rule-title">水果機制（每 35 分生成）</span>：拾取可獲 <span class="rule-hl">⭐ 護盾</span>（抵擋 1 次傷害）並引爆最近障礙物！
                        </div>
                    </div>
                    <div class="rule-item rule-meteor">
                        <span class="rule-icon">☄️</span>
                        <div class="rule-text">
                            <span class="rule-title">夜間隕石（每 100 分切換黑夜）</span>：由右上斜飛而下！請及時<span class="rule-hl">跳躍或趴下</span>閃避，護盾亦能保命！
                        </div>
                    </div>
                </div>

                <button id="confirmCharBtn">✅ 確認出發！</button>
            </section>

            <!-- Top-right audio controls -->
            <div id="btnBar">
                <button id="musicBtn">🎵 音樂: 開</button>
                <button id="sfxBtn">🔊 音效: 開</button>
            </div>

            <!-- Canvas -->
            <canvas id="gameCanvas" width="900" height="300"></canvas>

            <!-- Start screen -->
            <section id="startScreen" style="display:none;">
                <div class="start-content">
                    <h2>🦕 DINO RUN</h2>
                    <p>準備好開始了嗎？</p>
                    <div class="start-key">⬆ SPACE 開始遊戲</div>
                </div>
            </section>

            <!-- Game Over -->
            <section id="gameOver" style="display:none;">
                <h2>GAME OVER</h2>
                <p>分數：<span id="finalScore">00000</span></p>
                <button id="restartBtn">🔄 重新選擇角色</button>
                <p style="margin-top:12px; font-size:14px;">⬆ SPACE 也可以返回選角</p>
            </section>

        </main>

        <footer class="controls">
            <div><span class="key">⬆</span><span class="key">SPACE</span> 跳躍</div>
            <div><span class="key">⬇</span> 趴下</div>
            <div>速度：<span id="speedText">1.0x</span></div>
            <button class="mode-btn" id="nightModeBtn">☀ / 🌙 夜間模式</button>
        </footer>
    </div>

    <script type="module" src="./js/main.js?v=15"></script>
</body>
</html>
