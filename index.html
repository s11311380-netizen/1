<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DINO RUN - 恐龍跳躍</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-dino">🦕</div>
                <div>
                    <h1>DINO RUN</h1>
                    <p>躲避障礙，跑得更遠！</p>
                </div>
            </div>

            <div class="score-board">
                分數 <span id="score" class="score">00000</span>
                <br>
                最高<span id="highScore" class="score">00000</span>
            </div>
        </header>

        <!-- Game Stage -->
        <main id="game">

            <!-- 背景裝飾 -->
            <div class="sun"></div>

            <div class="stars">
                <span class="star" style="left:10%;top:20%"></span>
                <span class="star" style="left:20%;top:35%"></span>
                <span class="star" style="left:35%;top:15%"></span>
                <span class="star" style="left:50%;top:30%"></span>
                <span class="star" style="left:70%;top:18%"></span>
                <span class="star" style="left:85%;top:35%"></span>
            </div>

            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>

            <!-- 開始畫面覆蓋層 -->
            <section id="startScreen">
                <div class="start-content">
                    <h2>🦕 DINO RUN</h2>
                    <p>準備好開始冒險了嗎？</p>
                    <div class="start-key">⬆ SPACE 開始遊戲</div>
                </div>
            </section>

            <!-- 恐龍實體 -->
            <div id="dino">
                <div class="eye"></div>
                <div class="leg leg1"></div>
                <div class="leg leg2"></div>
            </div>

            <!-- 地面 -->
            <div class="ground"></div>

            <!-- 遊戲結束覆蓋層 -->
            <section id="gameOver">
                <h2>GAME OVER</h2>
                <p>分數：<span id="finalScore">00000</span></p>
                <button id="restartBtn">🔄 重新開始</button>
                <p style="margin-top: 15px; font-size: 16px;">⬆ SPACE 也可以重新開始</p>
            </section>

        </main>

        <!-- Controls Footer -->
        <footer class="controls">
            <div>
                <span class="key">⬆</span>
                <span class="key">SPACE</span>
                跳躍
            </div>

            <div>
                <span class="key">⬇</span>
                蹲下
            </div>

            <div>
                速度：<span id="speedText">1.0x</span>
            </div>

            <button class="mode-btn" id="nightModeBtn">
                ☀ / 🌙 夜間模式
            </button>
        </footer>

    </div>

    <!-- ES6 Module Entry -->
    <script type="module" src="./js/main.js"></script>

</body>
</html>
