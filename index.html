<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DINO RUN - Canvas Upgrade</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
        /* ── Game container ─────────────────────────────────────────── */
        #game {
            position: relative;
            overflow: hidden;
            background: #87CEEB;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ── Top-right mute buttons ──────────────────────────────────── */
        #btnBar {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
            display: flex;
            gap: 6px;
        }
        #btnBar button {
            cursor: pointer;
            padding: 4px 10px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            font-size: 12px;
            font-family: 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
            transition: background 0.2s;
            white-space: nowrap;
        }
        #btnBar button:hover  { background: rgba(0,0,0,0.7); }
        #btnBar button.muted  { background: rgba(180,0,0,0.55); }

        /* ── Loading screen ──────────────────────────────────────────── */
        #loadingScreen {
            position: absolute;
            inset: 0;
            background: #222;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            font-size: 22px;
            font-family: 'Microsoft JhengHei', '微軟正黑體', Arial, sans-serif;
            gap: 14px;
        }
        .loading-bar-wrap {
            width: 200px;
            height: 8px;
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
            overflow: hidden;
        }
        .loading-bar-fill {
            height: 100%;
            width: 60%;
            background: #4fc3f7;
            border-radius: 4px;
            animation: loadPulse 1.2s ease-in-out infinite alternate;
        }
        @keyframes loadPulse {
            from { width: 30%; }
            to   { width: 90%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-dino">🦕</div>
                <div>
                    <h1>DINO RUN</h1>
                    <p>跑得越遠越好！</p>
                </div>
            </div>
            <div class="score-board">
                分 <span id="score" class="score">00000</span>
                <br>
                最高 <span id="highScore" class="score">00000</span>
            </div>
        </header>

        <main id="game" style="width: 900px; height: 300px;">
            <!-- Loading screen -->
            <div id="loadingScreen">
                <span>載入資源中…</span>
                <div class="loading-bar-wrap"><div class="loading-bar-fill"></div></div>
            </div>

            <!-- Top-right audio control buttons -->
            <div id="btnBar">
                <button id="musicBtn">🎵 音樂: 開</button>
                <button id="sfxBtn">🔊 音效: 開</button>
            </div>

            <!-- Game canvas -->
            <canvas id="gameCanvas" width="900" height="300"></canvas>

            <!-- Start screen (hidden until assets loaded) -->
            <section id="startScreen" style="display:none;">
                <div class="start-content">
                    <h2>🦕 DINO RUN</h2>
                    <p>準備好開始了嗎？</p>
                    <div class="start-key">⬆ SPACE 開始遊戲</div>
                </div>
            </section>

            <!-- Game over screen -->
            <section id="gameOver" style="display:none;">
                <h2>GAME OVER</h2>
                <p>分數：<span id="finalScore">00000</span></p>
                <button id="restartBtn">🔄 重新開始</button>
                <p style="margin-top: 15px; font-size: 16px;">⬆ SPACE 也可以重新開始</p>
            </section>
        </main>

        <footer class="controls">
            <div>
                <span class="key">⬆</span>
                <span class="key">SPACE</span>
                跳躍
            </div>
            <div>
                <span class="key">⬇</span>
                 趴下
            </div>
            <div>
                速度：<span id="speedText">1.0x</span>
            </div>
            <button class="mode-btn" id="nightModeBtn">
                ☀ / 🌙 夜間模式
            </button>
        </footer>
    </div>
    <script type="module" src="./js/main.js?v=4"></script>
</body>
</html>
